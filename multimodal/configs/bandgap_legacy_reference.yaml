seed: 42

paths:
  point_project: external/test_point
  cif_project: external/test_point

data:
  target_column: bandgap
  label_csv: external/test_point/qmof/prepared_esp7_ed003_4096_regenerated/manifest.csv
  label_id_column: qmof_id
  split_csv: external/test_point/qmof/prepared_esp7_ed003_4096_regenerated/cif_data/bandgap/splits.csv
  split_id_column: id
  cif_data_root: external/test_point/qmof/prepared_esp7_ed003_4096_regenerated/cif_data/bandgap
  point_root: external/EPS_fps/non_periodic
  point_cloud_variant: esp_highest_lowest_7pct
  num_points: 4096
  point_subdir: nonperiodic_fps
  point_file_template: "{variant}_nonperiodic_fps_{num_points}.ply"
  point_pack_path: external/test_point/output_merged_2w_qmof/point_packs_qmof/esp7_4096.npy
  feature_blocks: [esp, frac_pe]
  frac_pe_frequencies: 2
  normalize_xyz: true
  augment: false

cif_model:
  atom_fea_len: 64
  h_fea_len: 128
  n_conv: 3
  n_h: 1
  max_num_nbr: 12
  radius: 8.0

point_model:
  name: x3d
  width: 32
  blocks: [1, 2, 2, 2, 1]
  strides: [1, 4, 4, 4, 4]
  nsample: 16
  radius: 0.2
  aggr_feature_type: dp_fj
  expansion: 4
  sa_layers: 1
  sa_use_res: false
  x3d_layers: [false, false, false, true, true]
  sampler: fps
  fps_backend: native

fusion:
  type: gated
  projection_dim: 128
  hidden_dim: 128
  dropout: 0.2

training:
  device: cuda:0
  output_dir: ./outputs/qmof_bandgap_fusion_e100
  epochs: 100
  batch_size: 32
  num_workers: 2
  prefetch_factor: 2
  pin_memory: true
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  selection_metric: rmse
