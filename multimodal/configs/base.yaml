seed: 42

paths:
  # Bundled model implementations. Do not replace these with dataset paths.
  point_project: ./third_party/point
  cif_project: ./third_party/cif

data:
  # Values below are populated by --task and --data-manifest.
  target_column: null
  point_root: null
  label_csv: null
  point_cloud_variant: null
  num_points: 8192
  point_subdir: nonperiodic_fps
  point_file_template: "{variant}_nonperiodic_fps_{num_points}.ply"
  feature_blocks: [xyz, esp, frac_pe]
  frac_pe_frequencies: 1
  normalize_xyz: true
  augment: true
  cif_data_root: null

cif_model:
  atom_fea_len: 64
  h_fea_len: 128
  n_conv: 3
  n_h: 1
  max_num_nbr: 12
  radius: 8.0

point_model:
  name: x3d
  width: 32
  blocks: [1, 3, 5, 3, 3]
  strides: [1, 4, 4, 4, 4]
  nsample: 32
  radius: 0.2
  expansion: 1
  sa_layers: 1
  sa_use_res: false
  x3d_layers: [false, false, false, true, true]
  sampler: fps
  fps_backend: linspace
  # PointNet / Transformer parameters (used when switching models)
  hidden_dim: 128
  dropout: 0.1
  num_layers: 4
  num_heads: 8
  token_count: 512

fusion:
  type: gated
  projection_dim: 128
  hidden_dim: 128
  dropout: 0.2

training:
  device: auto
  output_dir: ./outputs/multimodal_13
  epochs: 50
  batch_size: 8
  num_workers: 4
  prefetch_factor: 2
  pin_memory: true
  lr: 0.0002
  weight_decay: 0.0001
  grad_clip: 1.0
