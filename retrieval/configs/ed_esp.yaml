seed: 42
data:
  ed_root: ./data/point_clouds/ed
  density_dir: density_0.03
  esp_root: ./data/point_clouds/esp
  point_variant: esp_highest_lowest_3pct
  num_points: 4096
  fps_dirname: nonperiodic_fps
  feature_blocks: [xyz, scalar, frac_pe]
  frac_pe_frequencies: 2
  normalize_xyz: true
  augment: true
  cache_data: false
  split: {train_ratio: 0.8, val_ratio: 0.1, test_ratio: 0.1}
model:
  ed_encoder: {width: 32, blocks: [1, 3, 5, 3, 3], strides: [1, 4, 4, 4, 4], nsample: 32, radius: 0.2, aggr_feature_type: dp_fj, expansion: 1, sa_layers: 1, sa_use_res: false, x3d_layers: [false, false, false, true, true]}
  projection: {embedding_dim: 256, dropout: 0.1}
training: {output_dir: ./runs/ed_esp, device: cuda, require_cuda: true, epochs: 200, batch_size: 64, num_workers: 2, pin_memory: true, prefetch_factor: 2, lr: 0.0003, weight_decay: 0.0001, temperature: 0.07}
