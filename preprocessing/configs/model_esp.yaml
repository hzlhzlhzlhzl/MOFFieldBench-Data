seed: 42
data:
  point_root: ${MOF_ESP_ROOT:-data/EPS_fps/non_periodic}
  # Optional downstream regression: labels are supplied externally, never bundled in data/.
  label_csv: ${MOF_LABELS:-/path/to/labels.csv}
  split_csv: ${MOF_SPLITS:-/path/to/splits.csv}
  point_cloud_variant: esp_highest_lowest_5pct
  point_file_template: '{variant}_nonperiodic_fps_{num_points}.ply'
  num_points: 6144
  nonperiodic_dirname: nonperiodic_fps
  target_column: Df
  feature_blocks: [xyz, esp, frac_pe]
  frac_pe_frequencies: 2
  augment: false
  normalize_xyz: true
  strict_split_coverage: true
model:
  name: x3d
  sampler: fps
  fps_backend: native
  width: 32
  blocks: [1, 2, 2, 2, 1]
  strides: [1, 4, 4, 4, 4]
  nsample: 16
  radius: 0.2
  expansion: 4
  hidden_dim: 128
  dropout: 0.1
training:
  output_dir: outputs/model_esp
  device: auto
  epochs: 50
  batch_size: 8
  num_workers: 2
  pin_memory: true
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  normalize_target: true
  target_transform: none
